name: Refresh server dependency lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/refresh-server-dependencies
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Update only patched body parser and upload middleware
        working-directory: server
        run: npm update body-parser multer --package-lock-only --no-fund --no-progress
      - name: Report remaining server dependency advisories
        working-directory: server
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = report.metadata?.vulnerabilities || {};
          console.log("NPM audit summary:", JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const advisories = (item.via || [])
              .filter(entry => typeof entry === "object")
              .map(entry => entry.title + " (" + entry.range + ")");
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories
            }));
          }
          if (Number(counts.high || 0) > 0 || Number(counts.critical || 0) > 0) {
            console.error("High or critical dependency advisories remain.");
            process.exitCode = 1;
          }
          NODE
      - name: Validate lockfile diff
        run: git diff --check -- server/package-lock.json
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-server-package-lock
          path: server/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile updates were available."
            exit 0
          fi
          git commit -m "chore(security): update patched server dependencies"
          for attempt in 1 2 3; do
            if git push origin HEAD:security/refresh-server-dependencies; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after branch refresh."
            git fetch origin security/refresh-server-dependencies
            git rebase origin/security/refresh-server-dependencies
            sleep $((attempt * 2))
          done
          echo "Unable to push the lockfile update after three attempts."
          exit 1
