name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client-build:
    name: Client production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Test multi-page routes
        working-directory: client
        run: npm run test:routes
      - name: Install Playwright test runner
        working-directory: client
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0
      - name: Install Chromium and OS dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: client
        run: npm run test:e2e
      - name: Build client
        working-directory: client
        run: npm run build

  server-regression:
    name: Server generator regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Report npm audit findings
        working-directory: server
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const findings = Object.entries(report.vulnerabilities || {});
          console.log("NPM audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of findings) {
            const advisories = (item.via || []).filter(v => typeof v === "object").map(v => v.title + " (" + v.range + ")");
            console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, advisories}));
          }
          NODE
      - name: Test XLSX upload archive safety
        working-directory: server
        run: node qa/xlsx-safety.test.mjs
      - name: Check server JavaScript syntax
        working-directory: server
        run: node --check server.js && node --check services/facultyWorkload.js && node --check services/timetableVersionDiff.js && node --check services/loginRateLimit.js && node --check middleware/auth.js && node --check routes/auth.js && node --check routes/attendance.js && node --check routes/students.js && node --check routes/studentPromotion.js && node --check routes/studentProfile.js && node --check routes/fees.js && node --check routes/sessionPlan.js && node --check routes/notifications.js && node --check services/xlsxSafety.js && node --check services/notificationAccess.js && node --check services/dateValidation.js && node --check services/timetableAccess.js
      - name: Test timetable version comparison
        working-directory: server
        run: npm run test:regression:timetable-version-diff
      - name: Test time slot input and collision validation
        working-directory: server
        run: npm run test:regression:time-slot-validation
      - name: Test academic-session program dates
        working-directory: server
        run: npm run test:regression:program-date-validation
      - name: Test required timetable workflow remarks
        working-directory: server
        run: npm run test:regression:timetable-workflow-notes
      - name: Test program-semester calendars and time-slot scopes
        working-directory: server
        run: npm run test:regression:program-semester-scope
      - name: Test program-specific session targets
        working-directory: server
        run: npm run test:regression:session-plan-targets
      - name: Test subject program mapping consistency
        working-directory: server
        run: npm run test:regression:subject-program-mapping
      - name: Test full-session plan versioning
        working-directory: server
        run: npm run test:regression:session-plan-versioning
      - name: Test subject weekly-session constraints
        working-directory: server
        run: npm run test:regression:subject-session-constraints
      - name: Test login failed-attempt limiter
        working-directory: server
        run: npm run test:regression:login-rate-limit
      - name: Test faculty workload capacity calculations
        working-directory: server
        run: npm run test:regression:faculty-workload
      - name: Run generator and validator regression tests
        working-directory: server
        run: npm run test:regression:generator-validator
      - name: Test holiday import parser
        working-directory: server
        run: npm run test:holiday-import
      - name: Test attendance access isolation
        working-directory: server
        run: npm run test:attendance-access
      - name: Test notification audience access
        working-directory: server
        run: npm run test:notification-access
      - name: Test timetable role scoping
        working-directory: server
        run: npm run test:timetable-access

  full-workflow-integration:
    name: Full timetable workflow on disposable MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Exercise full workflow in a disposable database
        working-directory: server
        env:
          NODE_ENV: test
          PORT: "5001"
          MONGO_URI: mongodb://127.0.0.1:27017/timetable_qa_${{ github.run_id }}_${{ github.run_attempt }}
          JWT_SECRET: qa-only-secret-not-for-production-1234567890
          DEFAULT_ADMIN_PASSWORD: DisposableQA-Only-Password-123!
          QA_BASE_URL: http://127.0.0.1:5001
          QA_ADMIN_USERNAME: admin
          QA_ADMIN_PASSWORD: DisposableQA-Only-Password-123!
          CORS_ORIGINS: http://localhost:5173
        run: |
          set -euo pipefail
          npm start > "$RUNNER_TEMP/timetable-api.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "----- Disposable test backend log -----"
            cat "$RUNNER_TEMP/timetable-api.log" || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:5001/api/readiness > "$RUNNER_TEMP/readiness.json"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Backend exited before it became ready."
              cat "$RUNNER_TEMP/timetable-api.log"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Backend did not become ready in the allotted time."
            cat "$RUNNER_TEMP/timetable-api.log"
            exit 1
          fi

          node qa/smoke.mjs
          npm run test:integration:full-workflow
          npm run test:regression:exports
          QA_ALLOW_EXPORT_FILTER_MUTATION=true npm run test:regression:export-filters
  production-smoke:
    name: Production read-only smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository for optional authenticated QA
        uses: actions/checkout@v4
      - name: Run optional authenticated production QA
        id: authenticated-qa
        continue-on-error: true
        env:
          RUN_PRODUCTION_AUTHENTICATED_QA: ${{ vars.RUN_PRODUCTION_AUTHENTICATED_QA }}
          QA_BASE_URL: ${{ vars.QA_BASE_URL || 'https://time-table-t8t9.onrender.com' }}
          QA_ADMIN_USERNAME: ${{ vars.QA_ADMIN_USERNAME || 'admin' }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: |
          if [ "${RUN_PRODUCTION_AUTHENTICATED_QA:-}" != "true" ]; then
            echo "Authenticated production QA skipped. Set repository variable RUN_PRODUCTION_AUTHENTICATED_QA=true and secret QA_ADMIN_PASSWORD to enable read-only authenticated checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$QA_ADMIN_PASSWORD" ]; then
            echo "::error::Authenticated QA is enabled but repository secret QA_ADMIN_PASSWORD is missing."
            exit 1
          fi
          node server/qa/smoke.mjs
      - name: Report optional authenticated QA failure
        if: steps.authenticated-qa.outcome == 'failure'
        run: |
          echo "::warning::Optional authenticated production QA failed. Verify QA_ADMIN_USERNAME and update the QA_ADMIN_PASSWORD repository secret to match the live admin account."
          echo "Warning: authenticated production QA failed with the configured test credentials. The independent read-only health, authorization-boundary, and CORS checks still run; update QA_ADMIN_PASSWORD to match the live admin account." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live frontend, API health, authentication boundaries, and CORS
        env:
          APP_URL: https://time-table-beige-three.vercel.app
          API_URL: https://time-table-t8t9.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const appUrl = process.env.APP_URL.replace(/\/$/, "");
          const apiUrl = process.env.API_URL.replace(/\/$/, "");

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function requestEventually(label, url, options = {}, accept = response => response.ok) {
            let lastError;
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              try {
                const response = await fetch(url, {
                  ...options,
                  signal: AbortSignal.timeout(15000),
                  redirect: "follow"
                });
                const body = await response.text();
                if (accept(response, body)) {
                  console.log(`PASS ${label}: HTTP ${response.status} (attempt ${attempt})`);
                  return { response, body };
                }
                lastError = new Error(`${label}: unexpected HTTP ${response.status}; body=${body.slice(0, 300)}`);
              } catch (error) {
                lastError = error;
              }
              if (attempt < 18) await sleep(5000);
            }
            throw lastError || new Error(`${label} failed without a response`);
          }

          const frontend = await requestEventually(
            "production frontend route",
            `${appUrl}/academic-structure`,
            {},
            (response, body) => response.status === 200 && /<div[^>]+id=["']root["']/.test(body)
          );

          const health = await requestEventually(
            "public API health",
            `${apiUrl}/api/health`,
            {},
            response => response.status === 200
          );
          const healthJson = JSON.parse(health.body);
          assert.equal(healthJson.ok, true, "API health endpoint did not report ok=true");
          assert.equal(healthJson.database, "connected", "API database is not connected");
          console.log("PASS MongoDB reports connected");

          const readiness = await requestEventually(
            "API readiness",
            `${apiUrl}/api/readiness`,
            {},
            response => response.status === 200
          );
          const readinessJson = JSON.parse(readiness.body);
          assert.equal(readinessJson.database, "connected", "API readiness reports database disconnected");
          console.log("PASS API readiness reports database connected");

          await requestEventually(
            "sessions endpoint rejects anonymous access",
            `${apiUrl}/api/sessions`,
            {},
            response => response.status === 401
          );
          await requestEventually(
            "academic structure rejects anonymous access",
            `${apiUrl}/api/academic-structure`,
            {},
            response => response.status === 401
          );

          const cors = await requestEventually(
            "Vercel-origin CORS preflight",
            `${apiUrl}/api/auth/login`,
            {
              method: "OPTIONS",
              headers: {
                Origin: appUrl,
                "Access-Control-Request-Method": "POST",
                "Access-Control-Request-Headers": "content-type,authorization"
              }
            },
            response => response.status >= 200 && response.status < 300
          );
          assert.equal(
            cors.response.headers.get("access-control-allow-origin"),
            appUrl,
            "CORS response does not allow the production frontend origin"
          );
          const methods = cors.response.headers.get("access-control-allow-methods") || "";
          assert.match(methods, /POST/i, "CORS response does not allow POST");
          console.log("PASS CORS permits the production frontend to call the API");

          console.log("Production smoke tests passed; no production records were created or modified.");
          NODE
