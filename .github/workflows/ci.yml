name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client-build:
    name: Client production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Test multi-page routes
        working-directory: client
        run: npm run test:routes
      - name: Install Playwright test runner
        working-directory: client
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0
      - name: Install Chromium and OS dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: client
        run: npm run test:e2e
      - name: Build client
        working-directory: client
        run: npm run build

  server-regression:
    name: Server generator regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Check server JavaScript syntax
        working-directory: server
        run: node --check server.js && node --check middleware/auth.js && node --check routes/auth.js && node --check routes/attendance.js && node --check routes/students.js && node --check routes/studentProfile.js && node --check routes/fees.js && node --check routes/sessionPlan.js && node --check routes/notifications.js && node --check services/notificationAccess.js && node --check services/dateValidation.js
      - name: Run generator and validator regression tests
        working-directory: server
        run: npm run test:regression:generator-validator
      - name: Test holiday import parser
        working-directory: server
        run: npm run test:holiday-import
      - name: Test attendance access isolation
        working-directory: server
        run: npm run test:attendance-access
      - name: Test notification audience access
        working-directory: server
        run: npm run test:notification-access
